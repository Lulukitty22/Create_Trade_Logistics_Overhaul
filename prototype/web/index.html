<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logistics Map</title>
<style>
  :root {
    --panel: rgba(18, 20, 26, 0.86);
    --line: rgba(255, 255, 255, 0.09);
    --text: #e6e8ee;
    --muted: #9aa1b2;
    --accent: #e0a040;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c8e8; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  canvas { display: block; }
  .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; width: 270px; padding: 12px 14px; }
  #hud h1 { font-size: 14px; margin: 0 0 2px; font-weight: 600; letter-spacing: 0.01em; }
  #hud .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  #status { color: var(--accent); font-size: 12px; min-height: 17px; display: inline; }
  .statusline { display: flex; align-items: center; gap: 7px; }
  #live { width: 8px; height: 8px; border-radius: 50%; background: #6b7080; flex: none; }
  #live.on { background: #4cd17a; box-shadow: 0 0 0 3px rgba(76, 209, 122, 0.18); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
  .row label { color: var(--text); }
  .row input[type=range] { width: 120px; accent-color: var(--accent); }
  .row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 1px 12px; font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 500; text-align: right; }
  button { width: 100%; margin-top: 8px; padding: 7px; border-radius: 7px; border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--text); font: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.12); }
  button:disabled { opacity: 0.5; cursor: default; }
  #help { bottom: 12px; left: 12px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
  #help kbd { color: var(--text); font: inherit; background: rgba(255,255,255,0.08); border-radius: 4px; padding: 0 5px; }
  #tip { position: absolute; pointer-events: none; padding: 7px 10px; font-size: 12px; display: none; white-space: nowrap; }
  /* terminals */
  #terminals { top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 24px); padding: 12px 14px; display: flex; flex-direction: column; }
  #terminals h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  #terminal-list, #terminal-stock { overflow-y: auto; }
  .terminal-row { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; margin: 0 0 4px; padding: 7px 9px; text-align: left; }
  .tname { font-weight: 600; }
  .tmeta { color: var(--muted); font-size: 11px; }
  #terminal-detail { display: flex; flex-direction: column; min-height: 0; }
  #terminal-title { font-weight: 600; margin: 2px 0 6px; }
  .stock-row { display: grid; grid-template-columns: 1fr auto 52px auto; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
  .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scount { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sqty, #stock-search, #order-address, .f input, .f select, .frow input, .frow select { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 5px; color: var(--text); font: inherit; padding: 3px 6px; width: 100%; }
  #terminal-body { overflow-y: auto; }
  #terminal-tabs { display: flex; gap: 4px; margin: 6px 0; }
  .tab { width: auto; margin: 0; padding: 2px 10px; font-size: 11px; text-transform: capitalize; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .f { display: grid; grid-template-columns: 92px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .f span { color: var(--muted); font-size: 11px; }
  .f input[type=checkbox] { width: 15px; }
  .fhead { margin: 9px 0 4px; font-size: 11px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
  .frow { display: grid; grid-template-columns: 1fr 58px 58px auto; gap: 4px; margin: 3px 0; }
  .mini { width: auto; margin: 0; padding: 1px 7px; font-size: 11px; }
  .sorder { width: auto; margin: 0; padding: 3px 8px; font-size: 11px; }
  #order-status { font-size: 11px; min-height: 15px; color: var(--muted); margin-top: 6px; }
  #order-status.pending { color: var(--accent); }
  #terminal-back { width: auto; padding: 2px 8px; font-size: 11px; margin: 0 0 6px; }
  /* id selectors outrank [hidden]{display:none}, so restore it explicitly */
  #terminals[hidden], #terminal-detail[hidden], #terminal-list[hidden], #dispatch[hidden] { display: none; }
  #dispatch { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 2px; }
  #dispatch-runs { overflow-y: auto; max-height: 190px; }
  .run { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; padding: 4px 0; cursor: pointer; border-top: 1px solid var(--line); }
  .run:hover { background: rgba(255,255,255,0.05); }
  .run .rnote { grid-column: 1 / -1; color: var(--muted); font-size: 11px; }
  .run.blocked .rnote { color: #e08a6a; }
  .map-label.wanted { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,160,64,0.22); }
  #map-labels { position: absolute; inset: 0; pointer-events: none; }
  .map-label { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
    background: rgba(18,20,26,0.85); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
    font-size: 11px; white-space: nowrap; color: var(--text); }
  .map-label:hover { border-color: var(--accent); }
  .map-label.station { color: #9ec9f0; border-color: rgba(111,168,220,0.4); pointer-events: none; }
  .map-label.train { color: #b6f0c6; border-color: rgba(76,209,122,0.4); pointer-events: none; font-size: 10px; }
  #tip .name { font-weight: 600; }
  #tip .ns { color: var(--muted); font-weight: 400; }
  #tip .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="hud" class="panel">
  <h1 id="world-name">Logistics Map</h1>
  <div class="sub">Voxy LOD terrain · prototype</div>
  <div class="statusline"><span id="live"></span><div id="status">Loading…</div></div>
  <div class="row"><label for="detail">Detail distance</label><input id="detail" type="range" min="0.5" max="10" step="0.25" value="3"></div>
  <div class="row"><label for="textures">Textures</label><input id="textures" type="checkbox" checked></div>
  <div class="row"><label for="caves">Show caves</label><input id="caves" type="checkbox"></div>
  <div class="row"><label for="lodtint">Colour by LOD level</label><input id="lodtint" type="checkbox"></div>
  <div class="row"><label for="flash">Highlight live updates</label><input id="flash" type="checkbox" checked></div>
  <div class="row"><label for="rails">Show railway</label><input id="rails" type="checkbox" checked></div>
  <button id="refresh">Full re-sync from game</button>
  <div class="stats" id="stats"></div>
</div>
<div id="help" class="panel"><kbd>Left drag</kbd> pan · <kbd>Right drag</kbd> rotate · <kbd>Wheel</kbd> zoom · <kbd>WASD</kbd> move · <kbd>Q</kbd>/<kbd>E</kbd> down/up</div>
<div id="tip" class="panel"></div>
<div id="map-labels"></div>
<div id="terminals" class="panel" hidden>
  <h2>Logistics terminals</h2>
  <div id="terminal-list"></div>
  <div id="dispatch" hidden>
    <div class="fhead">Dispatch <button id="dispatch-run" class="mini">Send all ready</button></div>
    <div id="dispatch-summary" class="tmeta"></div>
    <div id="dispatch-runs"></div>
  </div>
  <div id="terminal-detail" hidden>
    <button id="terminal-back">&larr; all terminals</button>
    <div id="terminal-title"></div>
    <div class="row"><label for="order-address">Deliver to</label><input id="order-address" placeholder="PD-C01-B02"></div>
    <div id="terminal-tabs"></div>
    <div id="terminal-body"></div>
    <div id="order-status"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
