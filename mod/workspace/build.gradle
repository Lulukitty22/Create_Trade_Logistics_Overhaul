plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Voxy is present at runtime (it ships in the modpack); we only compile against it.
// Put your own path in local.properties (ignored by git):  voxy_jar=C:/.../mods/voxy-0.2.9-alpha.jar
def localProps = new Properties()
if (file('local.properties').exists()) {
    file('local.properties').withInputStream { localProps.load(it) }
}
def voxyJar = localProps.getProperty('voxy_jar', '')
// Create, from the modpack, for the same reason (local.properties: create_jar)
def createJar = localProps.getProperty('create_jar', '')
// Optional: a modpack mods folder to drop built jars into (local.properties: mods_dir)
def modsDir = localProps.getProperty('mods_dir', '')

dependencies {
    if (voxyJar && file(voxyJar).exists()) {
        compileOnly files(voxyJar)
    } else {
        logger.lifecycle('No Voxy jar configured (local.properties: voxy_jar) - terrain code will not compile.')
    }
    if (createJar && file(createJar).exists()) {
        compileOnly files(createJar)
        // Create bundles its libraries (Ponder, Catnip, Flywheel, Registrate) as jar-in-jar, and
        // its own API leaks their types - SmartBlockEntity implements Ponder's VirtualBlockEntity -
        // so they have to be on the compile classpath too. Unpack them rather than ask for more
        // paths in local.properties.
        def createLibs = file("${layout.buildDirectory.get().asFile}/createLibs")
        copy {
            from zipTree(createJar).matching { include 'META-INF/jarjar/*.jar' }
            into createLibs
            eachFile { it.relativePath = new RelativePath(true, it.name) }
            includeEmptyDirs = false
        }
        compileOnly fileTree(dir: createLibs, include: '*.jar')
    } else {
        logger.lifecycle('No Create jar configured (local.properties: create_jar) - logistics code will not compile.')
    }
}

// The browser page is shared with the Python prototype rather than duplicated.
tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version: minecraft_version, neo_version: neo_version, mod_version: mod_version,
                 mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
    from(file("$projectDir/../../prototype/web")) { into "assets/${mod_id}/web" }
}

// Finished jars land next to the workspace, in mod/jars
tasks.named('jar', Jar).configure {
    destinationDirectory = file("$projectDir/../jars")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Copies the built jar into the modpack, replacing the previous one. Close the game first:
// Windows keeps the running game's jar locked.
tasks.register('deployMod', Copy) {
    dependsOn tasks.named('jar')
    onlyIf {
        if (!modsDir || !file(modsDir).isDirectory()) {
            logger.lifecycle('deployMod: set mods_dir in local.properties to enable')
            return false
        }
        return true
    }
    from tasks.named('jar')
    into modsDir
    doLast { logger.lifecycle("Deployed ${mod_id}-${mod_version}.jar to ${modsDir}") }
}
